# /etc/nginx/sites-available/heritcoin
# 심볼릭 링크: ln -s /etc/nginx/sites-available/heritcoin /etc/nginx/sites-enabled/

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.heritcoin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 리버스 프록시
server {
    listen 443 ssl;
    server_name api.heritcoin.com;

    ssl_certificate     /etc/letsencrypt/live/api.heritcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.heritcoin.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 업로드 최대 크기 (이미지 2장 기준)
    client_max_body_size 20M;

    # 프록시 공통 헤더
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API 요청
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 30s;
    }

    # WebSocket (채팅 Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
