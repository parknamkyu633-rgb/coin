name: Deploy Backend # v9

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test network connectivity
        run: |
          nc -zv -w 5 ${{ secrets.SERVER_HOST }} 22 && echo "Port 22 OPEN" || echo "Port 22 CLOSED/TIMEOUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          debug: true
          script: |
            set -e
            cd /opt/heritcoin

            # 최신 코드 pull
            git pull origin main

            # 이전 이미지 빌드 캐시 활용하여 재빌드
            docker compose --profile full build api

            # DB 스키마 동기화
            docker compose --profile full run --rm api npx prisma db push --accept-data-loss

            # 무중단 재시작 (새 컨테이너 올리고 → 구 컨테이너 종료)
            docker compose --profile full up -d --no-deps api

            # 30초 전 생성된 dangling 이미지 정리
            docker image prune -f --filter "until=30m"
